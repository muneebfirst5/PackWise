<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PackWise - Smart Packing List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        header {
            background: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            color: #2563eb;
        }

        header p {
            color: #666;
            margin-bottom: 0;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .generator-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            margin-top: 22px;
            background: #2563eb;
            color: white;
        }

        .generate-btn:hover {
            background: #1d4ed8;
        }

        #result {
            display: none;
            margin-top: 30px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .result-header h2 {
            margin: 0;
        }

        .counter {
            background: #e8f0ff;
            color: #2563eb;
            padding: 9px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .weather-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .weather-box h3 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .weather-box p {
            margin-bottom: 0;
            line-height: 1.5;
        }

        .weather-auto-info {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
        }

        .weather-auto-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .weather-auto-info p {
            margin: 0;
            color: #666;
            line-height: 1.5;
        }

        .reminder-box {
            margin-top: 15px;
            padding: 18px;
            border-radius: 12px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
        }

        .reminder-box h3 {
            margin-top: 0;
            color: #c2410c;
        }

        .reminder-box ul {
            margin-bottom: 0;
            padding-left: 20px;
        }

        .category {
            margin-top: 25px;
        }

        .category h3 {
            margin-bottom: 10px;
            color: #2563eb;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .packing-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .packing-list li {
            background: #f8fafc;
            margin-bottom: 8px;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .packing-list label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .packing-list input[type="checkbox"] {
            width: auto;
            transform: scale(1.2);
        }

        .packing-list input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            color: #777;
        }

        .essential {
            border-left: 4px solid #f59e0b !important;
        }

        .essential-badge {
            color: #b45309;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .action-buttons button,
        .saved-trips-btn {
            flex: 1;
            min-width: 150px;
        }

        .print-btn {
            background: #16a34a;
            color: white;
        }

        .save-btn {
            background: #7c3aed;
            color: white;
        }

        .saved-trips-btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            background: #0f766e;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
        }

        .clear-btn {
            background: #dc2626;
            color: white;
        }

        .saved-message {
            display: none;
            margin-top: 12px;
            color: #16a34a;
            font-weight: bold;
        }

        .trip-summary {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .trip-summary p {
            margin: 7px 0;
        }

        .trip-summary strong {
            color: #374151;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .generator-box {
                padding: 18px;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button,
            .saved-trips-btn {
                width: 100%;
            }
        }

        @media print {

            body {
                background: white;
            }

            header,
            .back-link,
            .generator-box > h2,
            .generator-box > label,
            .generator-box > input,
            .generator-box > select,
            .generate-btn,
            .action-buttons,
            .counter,
            .trip-summary {
                display: none !important;
            }

            .container {
                margin: 0;
                max-width: 100%;
            }

            .generator-box {
                box-shadow: none;
                padding: 0;
            }

            #result {
                display: block !important;
            }

            .packing-list li {
                background: white;
                border: 1px solid #ccc;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>PackWise</h1>
    <p>Your smart travel packing assistant</p>
</header>


<div class="container">

    <a href="index.html" class="back-link">
        ← Back to Home
    </a>


    <div class="generator-box">

        <h2>Create Your Smart Packing List</h2>


        <!-- HOME LOCATION -->

        <label for="homeLocation">
            Where do you live?
        </label>

        <input
            type="text"
            id="homeLocation"
            placeholder="e.g. Lahore, Pakistan"
        >


        <!-- DESTINATION -->

        <label for="destination">
            Destination
        </label>

        <input
            type="text"
            id="destination"
            placeholder="e.g. Dubai"
        >


        <!-- DAYS -->

        <label for="days">
            Number of Days
        </label>

        <input
            type="number"
            id="days"
            min="1"
            max="365"
            placeholder="e.g. 5"
        >


        <!-- TRAVELERS -->

        <label for="travelers">
            Number of Travelers
        </label>

        <input
            type="number"
            id="travelers"
            min="1"
            max="50"
            value="1"
            placeholder="e.g. 2"
        >


        <!-- GENDER -->

        <label for="gender">
            Traveler Type
        </label>

        <select id="gender">

            <option value="mixed">
                Mixed / Family
            </option>

            <option value="male">
                Male
            </option>

            <option value="female">
                Female
            </option>

        </select>


        <!-- TRIP TYPE -->

        <label for="tripType">
            Trip Type
        </label>

        <select id="tripType">

            <option value="beach">
                Beach Trip
            </option>

            <option value="hiking">
                Hiking Trip
            </option>

            <option value="international">
                International Trip
            </option>

            <option value="city">
                City Trip
            </option>

            <option value="business">
                Business Trip
            </option>

        </select>


        <!-- WEATHER -->

        <div class="weather-auto-info">
            <strong>Weather</strong>
            <p id="weatherStatus">
                PackWise will check the current weather for your destination automatically.
            </p>
        </div>


        <button
            class="generate-btn"
            onclick="generateList()"
        >
            Create My Packing List
        </button>


        <div id="result">

            <div class="result-header">

                <h2 id="listTitle">
                    Your Packing List
                </h2>

                <div
                    class="counter"
                    id="counter"
                >
                    0 / 0 packed
                </div>

            </div>


            <div
                class="trip-summary"
                id="tripSummary"
            ></div>


            <div
                class="weather-box"
                id="weatherBox"
            ></div>


            <div
                class="reminder-box"
                id="reminderBox"
            ></div>


            <div id="packingCategories"></div>


            <div class="action-buttons">

                <button
                    class="print-btn"
                    onclick="window.print()"
                >
                    Print List
                </button>


                <button
                    class="save-btn"
                    onclick="saveList()"
                >
                    Save Trip
                </button>


                <a
                    href="saved-trips.html"
                    class="saved-trips-btn"
                >
                    Saved Trips
                </a>


                <button
                    class="clear-btn"
                    onclick="clearList()"
                >
                    Clear List
                </button>

            </div>


            <div
                class="saved-message"
                id="savedMessage"
            >
                Packing trip saved successfully.
            </div>

        </div>

    </div>

</div>


<script>

let currentList = [];

let currentWeatherCategory = "mild";


/* GENERATE LIST */

async function generateList() {

    const homeLocation =
        document.getElementById("homeLocation")
        .value
        .trim();

    const destination =
        document.getElementById("destination")
        .value
        .trim();

    const days =
        parseInt(
            document.getElementById("days").value
        );

    const travelers =
        parseInt(
            document.getElementById("travelers").value
        );

    const gender =
        document.getElementById("gender").value;

    const tripType =
        document.getElementById("tripType").value;


    if (homeLocation === "") {

        alert(
            "Please enter where you live."
        );

        return;
    }


    if (destination === "") {

        alert(
            "Please enter your destination."
        );

        return;
    }


    if (isNaN(days) || days < 1) {

        alert(
            "Please enter a valid number of days."
        );

        return;
    }


    if (
        isNaN(travelers) ||
        travelers < 1
    ) {

        alert(
            "Please enter the number of travelers."
        );

        return;
    }


    /*
       Replace this with your actual Cloudflare Worker URL.
       Example:
       https://packwise-weather-xxxxx.workers.dev
    */
        const WEATHER_API_URL =
    "https://packwise-weather.muneebfirst5.workers.dev";

    const generateButton =
        document.querySelector(".generate-btn");

    const weatherStatus =
        document.getElementById("weatherStatus");

    generateButton.disabled = true;
    generateButton.textContent =
        "Checking weather...";

    weatherStatus.textContent =
        `Checking current weather in ${destination}...`;

    let weatherData = null;

    try {

        const response =
            await fetch(
                `${WEATHER_API_URL}/weather?city=${encodeURIComponent(destination)}`
            );

        let data = null;

        try {
            data = await response.json();
        } catch (error) {
            data = null;
        }

        if (!response.ok) {
            throw new Error(
                data && data.error
                    ? data.error
                    : "Could not get weather information."
            );
        }

        if (
            !data ||
            typeof data.temperature !== "number" ||
            !data.weather
        ) {
            throw new Error(
                "Weather information was incomplete."
            );
        }

        weatherData = data;

    } catch (error) {

        console.error(
            "Weather request failed:",
            error
        );

        weatherStatus.textContent =
            "Weather could not be checked right now. Please try again.";

        alert(
            "We could not get the current weather for this destination. Please check the destination name and try again."
        );

        generateButton.disabled = false;
        generateButton.textContent =
            "Create My Packing List";

        return;
    }

    const weather =
        getWeatherCategory(weatherData);

    currentWeatherCategory =
        weather;


    const clothing = [];
    const toiletries = [];
    const electronics = [];
    const documents = [];
    const essentials = [];


    /* BASIC CLOTHING */

    clothing.push({
        name:
            `T-shirts: ${days * travelers}`,
        essential: false
    });


    clothing.push({
        name:
            `Underwear: ${(days + 1) * travelers}`,
        essential: true
    });


    clothing.push({
        name:
            `Pairs of socks: ${(days + 1) * travelers}`,
        essential: false
    });


    clothing.push({
        name:
            `Pants / trousers: ${
                Math.max(
                    travelers,
                    Math.ceil(days / 2) * travelers
                )
            }`,
        essential: false
    });


    clothing.push({
        name:
            `Sleepwear: ${travelers} set${
                travelers > 1 ? "s" : ""
            }`,
        essential: false
    });


    clothing.push({
        name:
            `Comfortable shoes: ${travelers} pair${
                travelers > 1 ? "s" : ""
            }`,
        essential: true
    });


    /* TOILETRIES */

    toiletries.push({
        name: "Toothbrush and toothpaste",
        essential: true
    });


    toiletries.push({
        name: "Basic toiletries",
        essential: false
    });


    toiletries.push({
        name: "Deodorant",
        essential: false
    });


    toiletries.push({
        name: "Small first-aid kit",
        essential: true
    });


    /* ELECTRONICS */

    electronics.push({
        name: "Phone and charger",
        essential: true
    });


    electronics.push({
        name: "Power bank",
        essential: false
    });


    /* DOCUMENTS */

    documents.push({
        name: "Wallet",
        essential: true
    });


    documents.push({
        name: "Identification",
        essential: true
    });


    /* GENERAL */

    essentials.push({
        name:
            `Water bottle: ${travelers}`,
        essential: false
    });


    /* BEACH */

    if (tripType === "beach") {

        clothing.push({
            name:
                `Swimwear: ${travelers}–${travelers * 2} sets`,
            essential: true
        });


        essentials.push({
            name: "Sunglasses",
            essential: false
        });


        essentials.push({
            name: "Sunscreen",
            essential: true
        });


        essentials.push({
            name: "Beach towel",
            essential: false
        });


        essentials.push({
            name: "Flip-flops",
            essential: false
        });


        essentials.push({
            name: "Hat or cap",
            essential: false
        });
    }


    /* HIKING */

    if (tripType === "hiking") {

        clothing.push({
            name:
                `Comfortable hiking clothes: ${travelers} set${
                    travelers > 1 ? "s" : ""
                }`,
            essential: true
        });


        clothing.push({
            name:
                `Hiking shoes: ${travelers} pair${
                    travelers > 1 ? "s" : ""
                }`,
            essential: true
        });


        essentials.push({
            name:
                `Backpack: ${travelers}`,
            essential: true
        });


        essentials.push({
            name: "Rain jacket",
            essential: false
        });


        essentials.push({
            name: "Flashlight",
            essential: false
        });


        essentials.push({
            name:
                `Extra water: ${travelers}`,
            essential: true
        });
    }


    /* INTERNATIONAL */

    if (tripType === "international") {

        documents.push({
            name: "Passport",
            essential: true
        });


        documents.push({
            name: "Visa / travel documents",
            essential: true
        });


        documents.push({
            name: "Flight tickets",
            essential: true
        });


        documents.push({
            name:
                "Travel insurance documents",
            essential: false
        });


        documents.push({
            name:
                "Currency / payment card",
            essential: true
        });


        electronics.push({
            name:
                "Universal travel adapter",
            essential: true
        });
    }


    /* CITY */

    if (tripType === "city") {

        essentials.push({
            name: "Day bag",
            essential: false
        });


        essentials.push({
            name:
                "Comfortable walking shoes",
            essential: true
        });


        essentials.push({
            name:
                "Navigation app / map",
            essential: false
        });
    }


    /* BUSINESS */

    if (tripType === "business") {

        clothing.push({
            name:
                `Formal outfit: ${travelers}`,
            essential: true
        });


        essentials.push({
            name:
                "Notebook and pen",
            essential: false
        });


        electronics.push({
            name:
                "Laptop and charger",
            essential: true
        });
    }


    /* HOT WEATHER */

    if (weather === "hot") {

        clothing.push({
            name:
                "Lightweight clothing",
            essential: true
        });


        essentials.push({
            name:
                "Sunscreen",
            essential: true
        });


        essentials.push({
            name:
                "Sunglasses",
            essential: false
        });


        essentials.push({
            name:
                "Hat or cap",
            essential: false
        });
    }


    /* COLD WEATHER */

    if (weather === "cold") {

        clothing.push({
            name:
                "Warm jacket",
            essential: true
        });


        clothing.push({
            name:
                "Warm sweater",
            essential: true
        });


        clothing.push({
            name:
                "Warm socks",
            essential: false
        });


        essentials.push({
            name:
                "Gloves",
            essential: false
        });


        essentials.push({
            name:
                "Scarf",
            essential: false
        });
    }


    /* RAINY WEATHER */

    if (weather === "rainy") {

        essentials.push({
            name:
                "Umbrella",
            essential: true
        });


        essentials.push({
            name:
                "Rain jacket",
            essential: true
        });


        essentials.push({
            name:
                "Water-resistant bag cover",
            essential: false
        });
    }


    /* MILD WEATHER */

    if (weather === "mild") {

        clothing.push({
            name:
                "Light jacket",
            essential: false
        });


        essentials.push({
            name:
                "Reusable water bottle",
            essential: false
        });
    }


    /* FINAL LIST */

    currentList = [

        {
            title: "Clothing",
            items: clothing
        },

        {
            title: "Toiletries",
            items: toiletries
        },

        {
            title: "Electronics",
            items: electronics
        },

        {
            title: "Documents",
            items: documents
        },

        {
            title: "Essentials",
            items: essentials
        }

    ];


    createDestinationReminders(
        destination,
        tripType
    );


    renderList();


    document.getElementById(
        "listTitle"
    ).textContent =
        `Packing List for ${destination}`;


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "savedMessage"
    ).style.display =
        "none";


    showWeatherInfo(weatherData, weather);

    showTripSummary();

    updateCounter();

    generateButton.disabled = false;
    generateButton.textContent =
        "Create My Packing List";
}


/* TRIP SUMMARY */

function showTripSummary() {

    const homeLocation =
        document.getElementById(
            "homeLocation"
        ).value;

    const destination =
        document.getElementById(
            "destination"
        ).value;

    const days =
        document.getElementById(
            "days"
        ).value;

    const travelers =
        document.getElementById(
            "travelers"
        ).value;

    const gender =
        document.getElementById(
            "gender"
        ).value;


    let genderText = "Mixed / Family";


    if (gender === "male") {
        genderText = "Male";
    }

    if (gender === "female") {
        genderText = "Female";
    }


    document.getElementById(
        "tripSummary"
    ).innerHTML = `

        <p>
            <strong>From:</strong>
            ${homeLocation}
        </p>

        <p>
            <strong>Destination:</strong>
            ${destination}
        </p>

        <p>
            <strong>Days:</strong>
            ${days}
        </p>

        <p>
            <strong>Travelers:</strong>
            ${travelers}
        </p>

        <p>
            <strong>Traveler Type:</strong>
            ${genderText}
        </p>

    `;
}


/* WEATHER CATEGORY */

function getWeatherCategory(weatherData) {

    const temperature =
        weatherData.temperature;

    const main =
        String(
            weatherData.weather || ""
        ).toLowerCase();

    if (
        main.includes("rain") ||
        main.includes("drizzle") ||
        main.includes("thunderstorm")
    ) {
        return "rainy";
    }

    if (temperature >= 28) {
        return "hot";
    }

    if (temperature <= 15) {
        return "cold";
    }

    return "mild";
}


/* WEATHER INFO */

function showWeatherInfo(
    weatherData,
    weatherCategory
) {

    const weatherBox =
        document.getElementById(
            "weatherBox"
        );

    const temperature =
        Math.round(
            weatherData.temperature
        );

    const feelsLike =
        Math.round(
            weatherData.feelsLike
        );

    const description =
        weatherData.description ||
        "Current conditions";

    const humidity =
        weatherData.humidity;

    const windSpeed =
        weatherData.windSpeed;

    const categoryTitles = {

        hot: "Hot Weather",

        cold: "Cold Weather",

        rainy: "Rainy Weather",

        mild: "Mild Weather"

    };

    const packingAdvice = {

        hot:
            "Pack lightweight clothing, sun protection and stay hydrated.",

        cold:
            "Warm layers, a jacket and comfortable closed shoes are recommended.",

        rainy:
            "Keep rain protection handy and protect electronics from water.",

        mild:
            "Comfortable clothing with one light layer should work well."

    };

    const location =
        weatherData.country
            ? `${weatherData.city}, ${weatherData.country}`
            : weatherData.city;


    weatherBox.innerHTML = `

        <h3>
            ${categoryTitles[weatherCategory]}
        </h3>

        <p>
            <strong>${location}</strong>
        </p>

        <p>
            Current temperature:
            <strong>${temperature}°C</strong>
            · Feels like:
            <strong>${feelsLike}°C</strong>
        </p>

        <p>
            Conditions:
            ${description}
        </p>

        <p>
            Humidity:
            ${humidity}%
            · Wind:
            ${windSpeed} m/s
        </p>

        <p>
            ${packingAdvice[weatherCategory]}
        </p>

    `;

    const weatherStatus =
        document.getElementById(
            "weatherStatus"
        );

    weatherStatus.textContent =
        `Current weather found for ${location}: ${temperature}°C and ${description}.`;
}


/* 
   The weather category is used by the packing-list rules:
   hot, cold, rainy or mild.
*/


/* DESTINATION REMINDERS */

function createDestinationReminders(
    destination,
    tripType
) {

    const reminderBox =
        document.getElementById(
            "reminderBox"
        );


    const lower =
        destination.toLowerCase();


    let reminders = [];


    if (
        tripType === "international"
    ) {

        reminders.push(
            "Check your passport validity before travelling."
        );

        reminders.push(
            "Keep important travel documents accessible."
        );
    }


    if (
        lower.includes("dubai") ||
        lower.includes("uae")
    ) {

        reminders.push(
            "Consider lightweight clothing for hot weather."
        );

        reminders.push(
            "Keep sun protection with you."
        );
    }


    if (
        lower.includes("murree") ||
        lower.includes("naran") ||
        lower.includes("hunza")
    ) {

        reminders.push(
            "Mountain weather can change quickly."
        );

        reminders.push(
            "Keep a warm layer and rain protection."
        );
    }


    if (
        lower.includes("maldives")
    ) {

        reminders.push(
            "Pack swimwear and sun protection."
        );

        reminders.push(
            "Protect electronics from water and sand."
        );
    }


    if (reminders.length === 0) {

        reminders.push(
            "Check the local weather before departure."
        );

        reminders.push(
            "Keep essential documents and valuables secure."
        );
    }


    let html =
        "<h3>Travel Reminders</h3><ul>";


    reminders.forEach(
        reminder => {

            html += `
                <li>
                    ${reminder}
                </li>
            `;

        }
    );


    html += "</ul>";


    reminderBox.innerHTML =
        html;
}


/* RENDER LIST */

function renderList() {

    const container =
        document.getElementById(
            "packingCategories"
        );


    container.innerHTML = "";


    let itemNumber = 0;


    currentList.forEach(
        category => {

            if (
                category.items.length === 0
            ) {
                return;
            }


            const categoryDiv =
                document.createElement(
                    "div"
                );


            categoryDiv.className =
                "category";


            const heading =
                document.createElement(
                    "h3"
                );


            heading.textContent =
                category.title;


            const ul =
                document.createElement(
                    "ul"
                );


            ul.className =
                "packing-list";


            category.items.forEach(
                item => {

                    const li =
                        document.createElement(
                            "li"
                        );


                    if (item.essential) {

                        li.classList.add(
                            "essential"
                        );

                    }


                    itemNumber++;


                    const label =
                        document.createElement(
                            "label"
                        );


                    const checkbox =
                        document.createElement(
                            "input"
                        );


                    checkbox.type =
                        "checkbox";


                    checkbox.dataset.item =
                        itemNumber;


                    checkbox.addEventListener(
                        "change",
                        updateCounter
                    );


                    const span =
                        document.createElement(
                            "span"
                        );


                    span.textContent =
                        item.name;


                    if (item.essential) {

                        const badge =
                            document.createElement(
                                "small"
                            );


                        badge.className =
                            "essential-badge";


                        badge.textContent =
                            " ESSENTIAL";


                        span.appendChild(
                            badge
                        );
                    }


                    label.appendChild(
                        checkbox
                    );


                    label.appendChild(
                        span
                    );


                    li.appendChild(
                        label
                    );


                    ul.appendChild(
                        li
                    );

                }
            );


            categoryDiv.appendChild(
                heading
            );


            categoryDiv.appendChild(
                ul
            );


            container.appendChild(
                categoryDiv
            );

        }
    );
}


/* COUNTER */

function updateCounter() {

    const checkboxes =
        document.querySelectorAll(
            '.packing-list input[type="checkbox"]'
        );


    const checked =
        document.querySelectorAll(
            '.packing-list input[type="checkbox"]:checked'
        );


    document.getElementById(
        "counter"
    ).textContent =
        `${checked.length} / ${checkboxes.length} packed`;
}


/* SAVE TRIP */

function saveList() {

    if (
        currentList.length === 0
    ) {

        alert(
            "Please create a packing list first."
        );

        return;
    }


    const data = {

        homeLocation:
            document.getElementById(
                "homeLocation"
            ).value.trim(),

        destination:
            document.getElementById(
                "destination"
            ).value.trim(),

        days:
            document.getElementById(
                "days"
            ).value,

        travelers:
            document.getElementById(
                "travelers"
            ).value,

        gender:
            document.getElementById(
                "gender"
            ).value,

        tripType:
            document.getElementById(
                "tripType"
            ).value,

        weather:
            currentWeatherCategory,

        list:
            currentList,

        savedAt:
            new Date().toLocaleString()

    };


    /* Save current list */

    localStorage.setItem(
        "packwisePackingList",
        JSON.stringify(data)
    );


    /* Get existing trips */

    let savedTrips = [];


    try {

        savedTrips =
            JSON.parse(
                localStorage.getItem(
                    "packwiseTrips"
                ) || "[]"
            );

    } catch (error) {

        savedTrips = [];

    }


    /* Add new trip */

    savedTrips.push(data);


    /* Save all trips */

    localStorage.setItem(
        "packwiseTrips",
        JSON.stringify(
            savedTrips
        )
    );


    document.getElementById(
        "savedMessage"
    ).style.display =
        "block";
}


/* LOAD SELECTED TRIP */

function loadSelectedTrip() {

    const saved =
        localStorage.getItem(
            "packwiseSelectedTrip"
        );


    if (!saved) {
        return;
    }


    try {

        const trip =
            JSON.parse(saved);


        document.getElementById(
            "homeLocation"
        ).value =
            trip.homeLocation || "";


        document.getElementById(
            "destination"
        ).value =
            trip.destination || "";


        document.getElementById(
            "days"
        ).value =
            trip.days || "";


        document.getElementById(
            "travelers"
        ).value =
            trip.travelers || 1;


        document.getElementById(
            "gender"
        ).value =
            trip.gender || "mixed";


        document.getElementById(
            "tripType"
        ).value =
            trip.tripType || "international";


        currentList =
            trip.list || [];


        renderList();


        document.getElementById(
            "listTitle"
        ).textContent =
            `Packing List for ${
                trip.destination || "Trip"
            }`;


        document.getElementById(
            "result"
        ).style.display =
            "block";


        const savedWeatherCategory =
            trip.weather || "mild";

        currentWeatherCategory =
            savedWeatherCategory;

        showWeatherInfo(
            {
                city:
                    trip.destination ||
                    "Saved destination",
                country: "",
                temperature: 0,
                feelsLike: 0,
                humidity: 0,
                weather:
                    savedWeatherCategory,
                description:
                    "Saved weather category",
                windSpeed: 0
            },
            savedWeatherCategory
        );

        document.getElementById(
            "weatherStatus"
        ).textContent =
            "This trip was saved with its previous weather category. Create a new list to check current weather.";


        createDestinationReminders(
            trip.destination || "",
            trip.tripType || ""
        );


        showTripSummary();


        updateCounter();


        localStorage.removeItem(
            "packwiseSelectedTrip"
        );

    } catch (error) {

        console.log(
            "Could not load saved trip."
        );

    }
}


/* CLEAR */

function clearList() {

    currentList = [];

    currentWeatherCategory = "mild";


    document.getElementById(
        "packingCategories"
    ).innerHTML = "";


    document.getElementById(
        "weatherBox"
    ).innerHTML = "";


    document.getElementById(
        "reminderBox"
    ).innerHTML = "";


    document.getElementById(
        "tripSummary"
    ).innerHTML = "";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    document.getElementById(
        "savedMessage"
    ).style.display =
        "none";


    document.getElementById(
        "counter"
    ).textContent =
        "0 / 0 packed";
}


/* AUTO LOAD */

window.addEventListener(
    "DOMContentLoaded",
    loadSelectedTrip
);

</script>
